<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff"/>
      <stop offset="100%" stop-color="#004999"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
  </defs>

  <!-- Círculo base con degradado corporativo -->
  <circle cx="100" cy="100" r="94" fill="url(#brandGradient)"/>

  <!-- Anillo interior sutil -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>

  <!-- Gota (piel sana / hidratación) en blanco, símbolo central limpio -->
  <path d="M100 48
           C100 48 62 92 62 124
           a38 38 0 0 0 76 0
           C138 92 100 48 100 48 Z"
        fill="#ffffff"/>

  <!-- Brillo de la gota -->
  <path d="M86 112
           a16 16 0 0 0 -6 16"
        fill="none" stroke="#0080ff" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

  <!-- Acento verde: media luna inferior que sugiere cuidado/renovación -->
  <path d="M100 162
           a38 38 0 0 0 36 -26
           a38 38 0 0 1 -72 0
           a38 38 0 0 0 36 26 Z"
        fill="url(#accentGradient)" opacity="0.9"/>
</svg>
