<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Stefany Salinas — Dermatología">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap');
      .seal-top {
        font-family: 'Jost', 'Segoe UI', Tahoma, sans-serif;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 5px;
        fill: #faf7f2;
      }
      .seal-bot {
        font-family: 'Jost', 'Segoe UI', Tahoma, sans-serif;
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 6px;
        fill: #c7a062;
      }
      .center-s {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 600;
        font-size: 115px;
        fill: #c7a062;
      }
    ]]></style>
    <radialGradient id="bgGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#3a575a"/>
      <stop offset="100%" stop-color="#233a3c"/>
    </radialGradient>
    <!-- Arc paths for curved text -->
    <path id="topArc" d="M 50 160 A 110 110 0 0 1 270 160" fill="none"/>
    <path id="botArc" d="M 50 160 A 110 110 0 0 0 270 160" fill="none"/>
  </defs>

  <!-- Base circle petróleo -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGrad)"/>

  <!-- Anillo dorado exterior -->
  <circle cx="160" cy="160" r="150" fill="none" stroke="#c7a062" stroke-width="2"/>
  <!-- Anillo interior sutil -->
  <circle cx="160" cy="160" r="134" fill="none" stroke="#c7a062" stroke-width="0.8" opacity="0.55"/>

  <!-- Texto curvado superior -->
  <text class="seal-top">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">STEFANY SALINAS</textPath>
  </text>

  <!-- Texto curvado inferior -->
  <text class="seal-bot">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">DERMATOLOGÍA</textPath>
  </text>

  <!-- Rombos dorados a los costados (3 y 9 en punto) -->
  <path d="M 44 160 L 50 153 L 56 160 L 50 167 Z" fill="#c7a062"/>
  <path d="M 264 160 L 270 153 L 276 160 L 270 167 Z" fill="#c7a062"/>

  <!-- Monograma S central -->
  <text class="center-s" x="160" y="200" text-anchor="middle">S</text>
</svg>
