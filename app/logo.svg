<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dra. Stefany Salinas — Dermatología">
  <defs>
    <linearGradient id="deepPetroleum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#355557"/>
      <stop offset="100%" stop-color="#233a3c"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b08d4f"/>
      <stop offset="50%" stop-color="#d7b47a"/>
      <stop offset="100%" stop-color="#b08d4f"/>
    </linearGradient>
  </defs>

  <!-- Base círculo petróleo -->
  <circle cx="100" cy="100" r="92" fill="url(#deepPetroleum)"/>

  <!-- Anillo dorado exterior -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#c7a062" stroke-width="1.5"/>
  <!-- Anillo interior sutil -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#c7a062" stroke-width="0.6" opacity="0.55"/>

  <!-- Monograma "SS" entrelazadas, estilo serif editorial -->
  <!-- S izquierda -->
  <path d="M78 70
           C62 70 58 86 72 92
           L92 100
           C106 106 102 122 86 122
           C76 122 70 118 66 112"
        fill="none" stroke="#faf7f2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- S derecha, superpuesta y en dorado -->
  <path d="M134 78
           C118 78 114 94 128 100
           L148 108
           C162 114 158 130 142 130
           C132 130 126 126 122 120"
        fill="none" stroke="#c7a062" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Línea dorada decorativa inferior -->
  <path d="M70 150 L130 150" stroke="url(#goldLine)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Pequeña rombo dorado al centro de la línea -->
  <path d="M100 145 L105 150 L100 155 L95 150 Z" fill="#c7a062"/>
</svg>
