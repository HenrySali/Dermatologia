<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Ilustración de infecciones fúngicas: dermatoscopio examinando colonias de hongos en la piel">
  <defs>
    <linearGradient id="bgHon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#efe7da"/>
    </linearGradient>
    <radialGradient id="skinHon" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbf0e4"/>
      <stop offset="1" stop-color="#f3e2cf"/>
    </radialGradient>
    <clipPath id="lensHon"><circle cx="166" cy="112" r="80"/></clipPath>
  </defs>

  <rect width="400" height="240" fill="url(#bgHon)"/>
  <circle cx="356" cy="34" r="74" fill="#c7a062" opacity="0.10"/>
  <circle cx="40" cy="214" r="56" fill="#2f4a4d" opacity="0.06"/>

  <!-- magnifier handle -->
  <line x1="221" y1="167" x2="300" y2="216" stroke="#b08d4f" stroke-width="18" stroke-linecap="round"/>
  <line x1="221" y1="167" x2="300" y2="216" stroke="#c7a062" stroke-width="9" stroke-linecap="round"/>

  <!-- lens -->
  <circle cx="166" cy="112" r="80" fill="url(#skinHon)"/>
  <g clip-path="url(#lensHon)">
    <!-- hyphae strands -->
    <g stroke="#2f4a4d" stroke-width="2" fill="none" opacity="0.35" stroke-linecap="round">
      <path d="M120 150 Q150 120 150 92"/>
      <path d="M150 92 Q170 70 200 74"/>
      <path d="M150 92 Q128 86 118 104"/>
      <path d="M186 140 Q196 118 190 100"/>
    </g>
    <!-- fungal colonies (rings) -->
    <g fill="none" stroke-width="3">
      <circle cx="150" cy="92" r="15" stroke="#2f4a4d"/>
      <circle cx="150" cy="92" r="4" fill="#c7a062" stroke="none"/>
      <circle cx="192" cy="110" r="12" stroke="#b08d4f"/>
      <circle cx="192" cy="110" r="3.5" fill="#2f4a4d" stroke="none"/>
      <circle cx="140" cy="134" r="13" stroke="#2f4a4d"/>
      <circle cx="140" cy="134" r="3.5" fill="#c7a062" stroke="none"/>
      <circle cx="186" cy="146" r="9" stroke="#b08d4f"/>
      <circle cx="118" cy="112" r="8" stroke="#2f4a4d" opacity="0.7"/>
    </g>
    <!-- spores -->
    <g fill="#c7a062" opacity="0.8">
      <circle cx="172" cy="128" r="2.4"/><circle cx="166" cy="100" r="2"/>
      <circle cx="204" cy="134" r="2"/><circle cx="128" cy="150" r="2"/>
    </g>
    <!-- lens shine -->
    <path d="M110 70 Q150 48 205 66 Q150 60 118 86 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- lens rings -->
  <circle cx="166" cy="112" r="80" fill="none" stroke="#2f4a4d" stroke-width="6"/>
  <circle cx="166" cy="112" r="73" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- accent baseline -->
  <rect x="258" y="150" width="92" height="4" rx="2" fill="#c7a062" opacity="0.5"/>
</svg>
