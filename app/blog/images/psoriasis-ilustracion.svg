<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Ilustración de psoriasis: dermatoscopio examinando placas y escamas en la piel">
  <defs>
    <linearGradient id="bgPso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#efe7da"/>
    </linearGradient>
    <radialGradient id="skinPso" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fbf0e4"/>
      <stop offset="1" stop-color="#f3e2cf"/>
    </radialGradient>
    <clipPath id="lensPso"><circle cx="166" cy="112" r="80"/></clipPath>
  </defs>

  <rect width="400" height="240" fill="url(#bgPso)"/>
  <circle cx="356" cy="34" r="74" fill="#c7a062" opacity="0.10"/>
  <circle cx="40" cy="214" r="56" fill="#2f4a4d" opacity="0.06"/>

  <!-- magnifier handle -->
  <line x1="221" y1="167" x2="300" y2="216" stroke="#b08d4f" stroke-width="18" stroke-linecap="round"/>
  <line x1="221" y1="167" x2="300" y2="216" stroke="#c7a062" stroke-width="9" stroke-linecap="round"/>

  <!-- lens -->
  <circle cx="166" cy="112" r="80" fill="url(#skinPso)"/>
  <g clip-path="url(#lensPso)">
    <!-- psoriasis plaques -->
    <g>
      <path d="M118 118 Q112 92 138 86 Q168 80 174 104 Q180 130 152 140 Q126 148 118 118 Z" fill="#d9a187" opacity="0.9"/>
      <path d="M168 140 Q164 118 188 112 Q214 108 218 130 Q222 154 196 160 Q172 164 168 140 Z" fill="#cf9279" opacity="0.9"/>
      <path d="M150 70 Q172 60 190 74 Q200 84 190 94 Q168 86 150 94 Q140 80 150 70 Z" fill="#deab92" opacity="0.85"/>
    </g>
    <!-- silvery scales -->
    <g fill="#f4e8da" opacity="0.9">
      <circle cx="138" cy="104" r="3"/><circle cx="150" cy="114" r="2.4"/>
      <circle cx="128" cy="116" r="2"/><circle cx="158" cy="100" r="2.2"/>
      <circle cx="190" cy="130" r="3"/><circle cx="200" cy="140" r="2.4"/>
      <circle cx="182" cy="142" r="2"/><circle cx="206" cy="126" r="2.2"/>
      <circle cx="170" cy="80" r="2.4"/><circle cx="182" cy="84" r="2"/>
    </g>
    <!-- lens shine -->
    <path d="M110 70 Q150 48 205 66 Q150 60 118 86 Z" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- lens rings -->
  <circle cx="166" cy="112" r="80" fill="none" stroke="#2f4a4d" stroke-width="6"/>
  <circle cx="166" cy="112" r="73" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>

  <!-- accent baseline -->
  <rect x="258" y="150" width="92" height="4" rx="2" fill="#c7a062" opacity="0.5"/>
</svg>
